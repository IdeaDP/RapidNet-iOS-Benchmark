name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build for iPhone
        run: |
          xcodebuild build \
            -project SwiftUITodo.xcodeproj \
            -scheme SwiftUITodo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/rapidnet-build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA for local signing
        run: |
          app="$RUNNER_TEMP/rapidnet-build/Build/Products/Release-iphoneos/SwiftUITodo.app"
          test -x "$app/SwiftUITodo"
          test -d "$app/RapidNet_M.mlmodelc"
          mkdir -p "$RUNNER_TEMP/rapidnet-ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/rapidnet-ipa/Payload/SwiftUITodo.app"
          cd "$RUNNER_TEMP/rapidnet-ipa"
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/BenchmarkApp.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: BenchmarkApp-IPA
          path: BenchmarkApp.ipa
          if-no-files-found: error

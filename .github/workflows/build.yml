name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject MLModel into Xcode Project
        run: |
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('SwiftUITodo.xcodeproj')
          target = project.targets.first
          file = project.new_file('SwiftUITodo/RapidNet_M.mlmodel')
          target.source_build_phase.add_file_reference(file)
          project.save
          "

      - name: Build Xcode Project
        run: |
          xcodebuild clean build \
            -project SwiftUITodo.xcodeproj \
            -scheme SwiftUITodo \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/SwiftUITodo.app Payload/
          zip -r BenchmarkApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenchmarkApp-IPA
          path: BenchmarkApp.ipa
